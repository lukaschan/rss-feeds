name: Update feeds

on:
  schedule:
    # 每天 22:17 UTC = 北京时间次日 06:17
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate feeds
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python generate.py

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update feeds"
          file_pattern: "site/* feeds/* archive/*"
