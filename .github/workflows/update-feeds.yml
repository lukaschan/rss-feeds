name: Update feeds

on:
  schedule:
    # 每天 22:17 UTC = 北京时间次日 06:17
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate feeds
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python generate.py

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update feeds"
          file_pattern: "site/* feeds/* archive/*"

      # 生成器按源隔离失败（好源照常提交），但把失败源写进 failures.txt；
      # 这里在提交完成后据此标红运行，让单源停更能被看见（收到失败通知）。
      - name: Surface source failures
        run: |
          if [ -s failures.txt ]; then
            echo "::error::以下源本次更新失败（其余源已正常提交）："
            cat failures.txt
            exit 1
          fi
          echo "全部源更新成功"
